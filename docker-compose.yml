
services:
  db:
    image: mariadb:10.11
    container_name: shemvener-kerenell-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: kerenell_nvsh25
      MYSQL_USER: kerenell_nvsh25
      MYSQL_PASSWORD: "p6@v[26S65"
    volumes:
      - shemvener_kerenell_db_data:/var/lib/mysql
      - ./kerenell_nvsh25.sql:/docker-entrypoint-initdb.d/kerenell_nvsh25.sql:ro

  wordpress:
    image: wordpress:latest
    container_name: shemvener-kerenell-wp
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: kerenell_nvsh25
      WORDPRESS_DB_USER: kerenell_nvsh25
      WORDPRESS_DB_PASSWORD: "p6@v[26S65"
    volumes:
      - ./:/var/www/html

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: shemvener-kerenell-pma
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_password

volumes:
  shemvener_kerenell_db_data:
